services:
  - type: web
    name: vaanibi
    env: python
    buildCommand: "apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_STT_MODEL
        value: "gnani/gnani"
      - key: GNANI_TTS_MODEL
        value: "gnani/gnani"
      - key: GNANI_TTS_VERSION
        value: "timbre-v2.5"
      - key: GNANI_DEFAULT_LANGUAGE
        value: "hi-IN"
      - key: GNANI_DEFAULT_VOICE
        value: "Nalini"
      - key: MAX_UPLOAD_MB
        value: "20"
